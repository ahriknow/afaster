# ═══════════════════════════════════════════════════════════════
#  支付宝电脑网站支付
#  Feature: ali-pay-web
# ═══════════════════════════════════════════════════════════════
[ali_pay]
app_id = ""                    # 支付宝应用 ID
private_key = """
-----BEGIN PRIVATE KEY...
...
-----END PRIVATE KEY...
"""                            # 应用私钥 (PKCS#8 PEM 格式)
alipay_public_key = """
-----BEGIN PUBLIC KEY...
...
-----END PUBLIC KEY...
"""                            # 支付宝公钥 (用于验签, PEM 格式)
notify_url = ""                # 异步通知回调完整 URL (发给支付宝)
# return_url = ""              # 同步跳转 return_url (可选)
# gateway = "https://openapi.alipay.com/gateway.do"  # API 网关, 默认值
# callback_path = "ali/pay/notify"  # 回调路由路径 (框架自动注册)

# ═══════════════════════════════════════════════════════════════
#  限流模块（基于 afast 内置限流）
#  Feature: rate-limit
# ═══════════════════════════════════════════════════════════════
[rate_limit]
# enabled = true                          # 是否启用限流, 默认 true
# default_policy = "global"               # 默认策略 ID（未在 handler 上指定时使用）
# rejected_code = 42001                   # 被拒绝时的错误码, 默认 42001
# rejected_message = "Too many requests"  # 被拒绝时的错误消息

# 全局限流策略（令牌桶, 允许突发）
[[rate_limit.policies]]
id = "global"               # 策略唯一标识
max_requests = 100          # 时间窗口内最大请求数
window_seconds = 60         # 时间窗口（秒）
algorithm = "token_bucket"  # 算法: fixed_window / sliding_window / token_bucket
key = "ip"                  # key 提取方式: ip / header / connection / global

# 登录防爆破（滑动窗口, 严格限流）
# [[rate_limit.policies]]
# id = "login"
# max_requests = 5
# window_seconds = 60
# algorithm = "sliding_window"
# key = "ip"

# 短信验证码（固定窗口）
# [[rate_limit.policies]]
# id = "sms"
# max_requests = 3
# window_seconds = 60
# algorithm = "fixed_window"
# key = "ip"

# ═══════════════════════════════════════════════════════════════
#  本地链路追踪
#  Feature: trace (自动启用 log + afast/hook + afast-ordinary-http)
#  可选 Feature: trace-sqlite / trace-http / trace-tcp / trace-receive-http / trace-receive-tcp
# ═══════════════════════════════════════════════════════════════
[tracing]
service_name = "afaster"                              # 服务名称
db_path = "tracing.db"                                # SQLite 存储路径（可选，需要 trace-sqlite feature）
# url = "/tracing"                                    # Web UI 路径，默认 /tracing
# retention_days = 7                                  # 数据保留天数，默认 7

# HTTP 发送端（可选，需要 trace-http feature，使用 afastdata 二进制协议）
# [tracing.http]
# url = "http://localhost:8080"                       # 远程服务地址
# path = "/tracing/report"                            # API 路径，默认 /tracing/report
# token = ""                                          # 认证 Token（可选）
# timeout = 5                                         # 请求超时（秒），默认 5

# TCP 发送端（可选，需要 trace-tcp feature，使用 afastdata 二进制协议）
# [tracing.tcp]
# addr = "127.0.0.1:9090"                             # 远程服务地址
# connect_timeout = 5                                 # 连接超时（秒），默认 5
# reconnect_interval = 3                              # 重连间隔（秒），默认 3

# 接收端：启用 trace-receive-http / trace-receive-tcp feature 后，
# 通过 afast 框架的 report / report_batch binary handler 自动接收外部项目上报，
# 无需额外配置。发送方配置 [tracing.http] 或 [tracing.tcp] 指向本项目即可。

# ═══════════════════════════════════════════════════════════════
#  静态文件服务
#  Feature: serve / serve-embed
# ═══════════════════════════════════════════════════════════════
[serve]
# prefix = "/"           # URL 前缀, 默认 "/"（即根路径）
# spa = true             # SPA 模式: 未找到文件时返回 index.html, 默认 false

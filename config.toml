# ═══════════════════════════════════════════════════════════════
#  服务器后端
# ═══════════════════════════════════════════════════════════════
[backend]
host = "0.0.0.0"  # 绑定地址
port = 5000       # 监听端口

# TLS / HTTPS（可选, Feature: afast-tls）
# [backend.tls]
# port = 443                          # HTTPS 监听端口, 默认 443
# cert_path = "/etc/ssl/cert.pem"     # PEM 证书链文件路径
# key_path = "/etc/ssl/key.pem"       # PEM 私钥文件路径

# ═══════════════════════════════════════════════════════════════
#  JWT 令牌
#  Feature: jwt
# ═══════════════════════════════════════════════════════════════
[token]
expire = 24                     # 令牌有效期 (小时), 如 24
secret = "your-jwt-secret-key"  # JWT 签名密钥

# ═══════════════════════════════════════════════════════════════
#  Snowflake ID 生成器
#  Feature: snow
# ═══════════════════════════════════════════════════════════════
[snow]
# worker_id = 1       # 机器 ID (0~31), 默认 1
# datacenter_id = 1   # 数据中心 ID (0~31), 默认 1
# epoch = 0           # 自定义起始时间 (毫秒时间戳), 0 = 使用当前时间, 默认 0

# ═══════════════════════════════════════════════════════════════
#  布隆过滤器
#  Feature: bloom
# ═══════════════════════════════════════════════════════════════
# [bloom]
# expected_items = 100000     # 预期存储的元素数量, 默认 100000
# false_positive_rate = 0.01  # 可接受的误判率 (0.0~1.0), 默认 0.01
# auto_check_key = "ip"       # Hook 自动检查的请求属性:
#                             #   "ip"             — 优先真实 IP (forwarded_for)，回退代理 IP (client_ip)
#                             #   "forwarded_for"  — 真实 IP (X-Forwarded-For / X-Real-IP)，回退代理 IP
#                             #   "client_ip"      — 代理 IP (TCP 直连地址)
#                             #   "path"           — 请求路径
#                             #   "method+path"    — HTTP 方法 + 路径
#                             #   "handler"        — handler 名称
#                             #   "header:<name>"  — 指定 Header 值
#                             #   不设置则仅将 BloomFilter 写入 ctx，由 handler 手动使用

# ═══════════════════════════════════════════════════════════════
#  Redis
#  Feature: redis (与 valkey 互斥)
# ═══════════════════════════════════════════════════════════════
[redis]
host = "127.0.0.1"  # 主机地址, 默认 127.0.0.1
port = 6380         # 端口, 默认 6379
# db = 0            # 数据库编号, 默认 0
# password = ""     # 密码, 为空时不使用密码连接
# prefix = ""       # Key 前缀, 用于多租户隔离

# ═══════════════════════════════════════════════════════════════
#  微信支付 V3（H5 / Native / APP / 小程序 / JSAPI）
#  Feature: wx-pay-h5 / wx-pay-native / wx-pay-app / wx-pay-mini / wx-pay-js
# ═══════════════════════════════════════════════════════════════
[wx_pay]
mch_id = ""                        # 商户号
app_id = ""                        # 应用 ID (AppID)
api_v3_key = ""                    # API v3 密钥 (32 字节)
private_key = """
-----BEGIN PRIVATE KEY...
...
-----END PRIVATE KEY...
"""                                # 商户 API 私钥 (PEM 格式)
serial_no = ""                     # 商户证书序列号
notify_url = ""                    # 支付回调完整 URL (发给微信, 一般情况下是 host + callback_path)
# refund_notify_url = ""           # 退款回调完整 URL (可选, 默认使用 notify_url)
# callback_path = "wx/pay/notify"  # 回调路由路径 (框架自动注册)
# platform_cert = """
# """                              # 微信支付平台证书公钥 (PEM 格式)

# ═══════════════════════════════════════════════════════════════
#  微信登录（小程序 / APP / 网页扫码 / 公众号授权）
#  Feature: wx-login-mini / wx-login-app / wx-login-web / wx-login-mp
# ═══════════════════════════════════════════════════════════════
[wxlogin]
# mini_id = ""                            # 小程序 AppID (wx-login-mini)
# mini_secret = ""                        # 小程序 AppSecret (wx-login-mini)
# app_id = ""                             # 移动应用 AppID (wx-login-app)
# app_secret = ""                         # 移动应用 AppSecret (wx-login-app)
# web_id = ""                             # 网站应用 AppID (wx-login-web)
# web_secret = ""                         # 网站应用 AppSecret (wx-login-web)
# redirect_base = ""                      # 授权回调基础地址, 如 "https://example.com" (wx-login-web)
# callback_path = "auth/wechat/callback"  # 回调路由路径 (wx-login-web, 框架自动注册)

# ═══════════════════════════════════════════════════════════════
#  微信公众号管理
#  Feature: wx-official
# ═══════════════════════════════════════════════════════════════
[wx_official]
app_id = ""                               # 公众号 AppID
app_secret = ""                           # 公众号 AppSecret
# base_url = "https://api.weixin.qq.com"  # API 基础地址, 默认值

# ═══════════════════════════════════════════════════════════════
#  推送服务
#  Feature: push / push-getui
# ═══════════════════════════════════════════════════════════════
[push]

[push.getui]                              # 个推 (push-getui)
app_id = ""                               # 个推应用 AppID
app_key = ""                              # 个推应用 AppKey
master_secret = ""                        # 个推应用 MasterSecret
# base_url = "https://restapi.getui.com"  # API 基础地址, 默认值

[push.jpush]       # 极光推送 (push-jpush)
app_key = ""                         # 极光应用 AppKey
master_secret = ""                   # 极光应用 Master Secret
# base_url = "https://api.jpush.cn"  # API 基础地址, 默认值
# apns_production = true             # APNs 是否生产环境, 默认 true
[push.xiaomi]      # 小米推送 (push-xiaomi)
package_name = ""                # 应用包名
app_secret = ""                  # APP_SECRET
# base_url = "https://api.xmpush.xiaomi.com"  # API 基础地址, 默认值
# ═══════════════════════════════════════════════════════════════
#  微信虚拟支付（小程序内虚拟商品）
#  Feature: wx-virtual-pay
# ═══════════════════════════════════════════════════════════════
[wx_virtual_pay]
offer_id = ""                              # 微信支付分配的 offer_id
app_key = ""                               # 签名密钥
env = 0                                    # 环境: 0=正式环境, 1=沙箱环境
mini_id = ""                               # 支付小程序 AppID
mini_secret = ""                           # 支付小程序 AppSecret
# callback_path = "wx/virtual-pay/notify"  # 回调路由路径, 默认值
# verify_token = ""                        # 消息推送 Token (GET 验签)
# msg_secret = ""                          # 消息推送 EncodingAESKey (43 字符, AES 解密)

# ═══════════════════════════════════════════════════════════════
#  微信内容安全
#  Feature: wx-sec-check
# ═══════════════════════════════════════════════════════════════
[wx_sec_check]
app_id = ""                               # 小程序/公众号 AppID
app_secret = ""                           # 小程序/公众号 AppSecret
# base_url = "https://api.weixin.qq.com"  # API 基础地址, 默认值
# callback_path = "wx/sec-check/notify"   # 回调路由路径, 默认值
# verify_token = ""                       # 消息推送 Token (GET 验签)
# msg_secret = ""                         # 消息推送 EncodingAESKey (43 字符, AES 解密)

# ═══════════════════════════════════════════════════════════════
#  数据库
#  Feature: db-postgres / db-sqlite / db-mysql
# ═══════════════════════════════════════════════════════════════
[postgres]
# host = "127.0.0.1"  # 主机地址
# port = 5432         # 端口
# user = ""           # 用户名
# pass = ""           # 密码
# name = ""           # 数据库名

[sqlite]
# path = "data.db"  # SQLite 文件路径

[mysql]
# host = "127.0.0.1"  # 主机地址
# port = 3306         # 端口
# user = ""           # 用户名
# pass = ""           # 密码
# name = ""           # 数据库名

# ═══════════════════════════════════════════════════════════════
#  腾讯云 COS 对象存储
#  Feature: cos
# ═══════════════════════════════════════════════════════════════
[cos]
secret_id = ""       # 腾讯云 SecretId
secret_key = ""      # 腾讯云 SecretKey
bucket = ""          # Bucket 名称, 格式: {bucketname}-{appid}
region = ""          # 地域, 如 "ap-guangzhou"
# prefix = ""        # 上传目录前缀
# domain = ""        # 自定义域名
# url_expire = 3600  # 签名 URL 有效期 (秒), 默认 3600

# ═══════════════════════════════════════════════════════════════
#  阿里云 OSS 对象存储
#  Feature: oss
# ═══════════════════════════════════════════════════════════════
[oss]
access_key_id = ""      # 阿里云 AccessKeyId
access_key_secret = ""  # 阿里云 AccessKeySecret
region = ""             # OSS 地域
bucket = ""             # Bucket 名称
# endpoint = ""         # OSS 端点, 空则自动推导 oss-{region}.aliyuncs.com
# url_expire = 3600     # 签名 URL 有效期 (秒), 默认 3600
# sts_expire = 3600     # STS 临时凭证有效期 (秒), 默认 3600
# role_arn   = ""       # RAM 角色 ARN, 空则禁用 STS
# prefix = ""           # 上传目录前缀
# domain = ""           # 自定义域名, 如 "file.example.com"

# ═══════════════════════════════════════════════════════════════
#  邮件发送
#  Feature: email
#  支持配置多个邮箱账户, 每个账户通过 id 唯一标识（不可重复）
#  发送时可通过 id 指定使用哪个账户, 未指定则使用 default
# ═══════════════════════════════════════════════════════════════
[email]
default = ""  # 默认邮箱 ID, 发送时未指定则使用此账户, 如 "main"

[[email.accounts]]
id     = ""         # 唯一标识（不可重复）, 如 "main"
host   = ""         # SMTP 服务器地址, 如 "smtp.domain.com"
port   = 465        # 端口（465=SSL, 587=STARTTLS）
user   = ""         # 登录用户名, 如 "example@domain.com"
pass   = ""         # 密码/授权码
from   = ""         # 发件人地址, 如 "example@domain.com"
name   = ""         # 发件人显示名称, 如 "AFaster"
# secure = true     # 是否使用 SSL/TLS, 默认 true
# starttls = false  # 是否使用 STARTTLS, 默认 false

# ═══════════════════════════════════════════════════════════════
#  阿里云短信
#  Feature: sms-ali
# ═══════════════════════════════════════════════════════════════
[sms_ali]
access_key_id     = ""               # 阿里云 AccessKeyId
access_key_secret = ""               # 阿里云 AccessKeySecret
# sign_name      = ""                # 默认短信签名
# template_code  = ""                # 默认验证码模板 Code, 如 "SMS_123456"
# callback_path  = "sms/ali/report"  # 回执回调路径, 默认 sms/ali/report

# ═══════════════════════════════════════════════════════════════
#  腾讯云短信
#  Feature: sms-tencent
# ═══════════════════════════════════════════════════════════════
[sms_tencent]
secret_id    = ""                       # 腾讯云 SecretId
secret_key   = ""                       # 腾讯云 SecretKey
sdk_app_id   = ""                       # 短信 SdkAppId, 如 "1400006666"
# sign_name    = ""                     # 默认短信签名
# template_id  = ""                     # 默认验证码模板 ID, 如 "123456"
# callback_path = "sms/tencent/report"  # 回执回调路径, 默认 sms/tencent/report

# ═══════════════════════════════════════════════════════════════
#  GitHub OAuth2 登录
#  Feature: github-oauth2(自动启用 nonce)
# ═══════════════════════════════════════════════════════════════
[github_oauth2]
client_id = ""                                                # GitHub OAuth App Client ID
client_secret = ""                                            # GitHub OAuth App Client Secret
redirect_base = ""                                            # 服务基础地址
# callback_path = "auth/github/callback"                      # 回调路径, 拼接后为完整 redirect_uri
# scope = "read:user user:email"                              # OAuth2 授权范围
# authorize_url = "https://github.com/login/oauth/authorize"  # 授权页面 URL
